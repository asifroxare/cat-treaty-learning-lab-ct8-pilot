[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edinsured-cat-treaty-learning-lab"
version = "0.1.0"
description = "Backend-first catastrophe treaty learning and experimentation lab"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13,<3",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]

[project.scripts]
cat-treaty-api = "cat_treaty.__main__:main"

[tool.setuptools.packages.find]
include = ["cat_treaty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
