[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edinsured-cat-treaty-learning-lab"
version = "0.1.0"
description = "Backend-first catastrophe treaty learning and experimentation lab"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.setuptools.packages.find]
include = ["cat_treaty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
